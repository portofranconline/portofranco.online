<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Análise de Instagram · Porto Franco Online</title>
<link rel="icon" href="logo.png">
<script>window.PFO_PROTEGIDA=true</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shim.js"></script>
<style>
:root{--bg:#f2f5fa;--tx:#0b1f3a;--mu:#5b6b7f;--cy:#0b7285;--rd:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{background:linear-gradient(120deg,#5b2a86,#c13584 55%,#f77737);color:#fff;padding:18px 16px;border-radius:0 0 22px 22px}
header h1{font-size:19px;margin:0}header small{opacity:.9}
main{max-width:860px;margin:auto;padding:12px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(11,31,58,.08)}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #c9d6e6;font:inherit}
.btn{border:0;border-radius:12px;padding:13px 14px;background:linear-gradient(135deg,#c13584,#f77737);color:#fff;font-weight:800;width:100%;margin-top:10px;font:inherit;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.6}.btn.g{background:#e7edf6;color:var(--tx)}
.mu{color:var(--mu);font-size:13px}.err{color:var(--rd);font-weight:700}
.pf{display:flex;gap:14px;align-items:center}.pf img{width:68px;height:68px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #f77737}
.pf b{font-size:17px}.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}@media(min-width:640px){.kp{grid-template-columns:repeat(4,1fr)}}
.kp div{border-radius:14px;padding:12px;background:#f6f0fb}.kp span{font-size:11.5px;font-weight:800;color:var(--mu);text-transform:uppercase}.kp b{display:block;font-size:22px}
.nota{border-radius:14px;padding:14px;margin-top:12px;font-weight:700}.n-ot{background:#dcf5ea;color:#12805c}.n-bo{background:#fff4d6;color:#8a5a00}.n-ba{background:#fde0e0;color:#b3261e}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:12px;border-bottom:1px solid #e6ecf4}
.bars a{flex:1;display:block;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#f77737,#c13584);min-height:3px}
.ps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.ps a{display:block;text-decoration:none;color:var(--tx);background:#f7f9fc;border-radius:12px;overflow:hidden;font-size:12px}
.ps img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#e7edf6}.ps span{display:block;padding:6px}
.hi{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef2f8;font-size:13.5px}.hi:last-child{border:0}
.hi button{border:0;background:none;color:var(--cy);font-weight:800;cursor:pointer;font:inherit}
ol{padding-left:20px}ol li{margin:6px 0}code{background:#eef2f8;padding:1px 5px;border-radius:5px;font-size:12.5px}
</style>
</head>
<body>
<header><h1>📈 Instagram @portofranco.online</h1><small>Alcance e engajamento dos últimos 30 dias</small></header>
<main>
<div class="card"><b>Analisar a conta</b><p class="mu">Busca os números oficiais do Instagram: alcance, visualizações, visitas ao perfil e o desempenho de cada publicação dos últimos 30 dias.</p>
 <button class="btn" id="go">🔄 Atualizar análise</button><div class="err" id="er"></div></div>
<div id="res"></div>
<div class="card" id="evo"></div>
<div class="card" id="hist"><b>🕘 Análises anteriores</b><p class="mu">Carregando…</p></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n=v=>(v==null?"—":Number(v).toLocaleString("pt-BR"));
const pc=v=>(v==null||!isFinite(v))?"—":(Math.round(v*100)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
const dt=d=>new Date(d).toLocaleDateString("pt-BR");

function analisar(R){
  const p=R.perfil,lim=new Date(R.em).getTime()-30*864e5,media=(p.media||[]).filter(x=>x.timestamp);
  let posts=media.filter(x=>new Date(x.timestamp).getTime()>=lim),janela="últimos 30 dias";
  if(!posts.length){posts=media.slice(0,12);janela="últimas "+posts.length+" publicações (nenhuma nos últimos 30 dias)"}
  const seg=p.followers_count||0,int=x=>x.total_interactions!=null?x.total_interactions:(x.like_count||0)+(x.comments_count||0);
  const erSeg=posts.map(x=>seg?int(x)/seg*100:0),erAlc=posts.filter(x=>x.reach).map(x=>int(x)/x.reach*100);
  const med=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
  const top=posts.map(x=>({...x,int:int(x)})).sort((a,b)=>(b.reach||b.int)-(a.reach||a.int)).slice(0,3);
  return{posts,janela,seg,int,erSeg:med(erSeg),erAlc:med(erAlc),top,alcMed:med(posts.filter(x=>x.reach).map(x=>x.reach))}}
function nota(er){if(er==null)return["n-bo","Sem dados suficientes"];if(er>=3)return["n-ot","🟢 Engajamento ótimo (acima de 3% dos seguidores)"];if(er>=1)return["n-bo","🟡 Engajamento bom (entre 1% e 3% dos seguidores)"];return["n-ba","🔴 Engajamento baixo (abaixo de 1% dos seguidores)"]}
function barras(lista,val,tit,link){const mx=Math.max(...lista.map(val),1);
  return `<div class="bars">${lista.map(x=>`<a ${link?`href="${esc(link(x))}" target="_blank"`:""} title="${esc(tit(x))}" style="height:${Math.max(2,val(x)/mx*100)}%"></a>`).join("")}</div>`}

function mostrar(R){
  const p=R.perfil,c=R.conta||{},a=analisar(R),[cl,tx]=nota(a.erSeg);
  $("#res").innerHTML=`<div class="card"><div class="pf">${p.profile_picture_url?`<img src="${esc(p.profile_picture_url)}" alt="" referrerpolicy="no-referrer">`:""}<div><b>@${esc(p.username)}</b><div class="mu">${esc(p.name||"")}</div><div class="mu">Atualizado em ${new Date(R.em).toLocaleString("pt-BR")}</div></div></div>
   <div class="kp"><div><span>Seguidores</span><b>${n(a.seg)}</b></div><div><span>Alcance (30 dias)</span><b>${n(c.reach)}</b><small class="mu">contas únicas</small></div>
   <div><span>Visualizações</span><b>${n(c.views)}</b></div><div><span>Visitas ao perfil</span><b>${n(c.profile_views)}</b></div>
   <div><span>Contas engajadas</span><b>${n(c.accounts_engaged)}</b></div><div><span>Interações</span><b>${n(c.total_interactions)}</b></div>
   <div><span>Publicações</span><b>${a.posts.length}</b><small class="mu">${a.janela}</small></div><div><span>Alcance médio/post</span><b>${n(a.alcMed&&Math.round(a.alcMed))}</b></div></div>
   <div class="nota ${cl}">${tx}<div class="mu" style="font-weight:500">Engajamento por seguidores: ${pc(a.erSeg)} · por alcance: ${pc(a.erAlc)}. Base: ${a.janela}.</div></div></div>
   ${(R.alcanceDia||[]).length?`<div class="card"><b>📅 Alcance por dia</b>${barras(R.alcanceDia,x=>x.v,x=>dt(x.d)+": "+n(x.v)+" contas")}<p class="mu">${dt(R.alcanceDia[0].d)} até ${dt(R.alcanceDia[R.alcanceDia.length-1].d)}</p></div>`:""}
   ${a.posts.length?`<div class="card"><b>📊 Alcance por publicação</b><p class="mu">Da mais antiga para a mais recente. Toque numa barra para abrir.</p>
    ${barras(a.posts.slice().reverse(),x=>x.reach||a.int(x),x=>dt(x.timestamp)+": alcance "+n(x.reach)+" · "+n(x.like_count)+" curtidas · "+n(x.comments_count)+" comentários",x=>x.permalink)}</div>
   <div class="card"><b>🏆 Melhores publicações</b><div class="ps">${a.top.map(x=>`<a href="${esc(x.permalink)}" target="_blank"><img src="${esc(x.thumbnail_url||x.media_url||"")}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'"><span><b>${n(x.reach)} alcance</b><br>${n(x.like_count)} ❤ · ${n(x.comments_count)} 💬${x.shares!=null?" · "+n(x.shares)+" ↗":""}<br>${dt(x.timestamp)}</span></a>`).join("")}</div></div>`:""}`}

let HIST=[];
async function historico(){
  try{const r=await PFO.client().from("app_docs").select("id,data").like("id","instagram/%");if(r.error)throw r.error;
    HIST=(r.data||[]).filter(x=>x.data&&x.data.perfil&&x.data.em).sort((a,b)=>a.data.em<b.data.em?1:-1);
    $("#hist").innerHTML='<b>🕘 Análises anteriores</b>'+(HIST.length?HIST.map((x,i)=>`<div class="hi"><span>${new Date(x.data.em).toLocaleString("pt-BR")}<br><small class="mu">${n(x.data.perfil.followers_count)} seguidores · alcance ${n(x.data.conta&&x.data.conta.reach)}</small></span><button data-i="${i}">ver</button></div>`).join(""):'<p class="mu">Nenhuma análise ainda.</p>');
    const ev=HIST.slice().reverse();
    $("#evo").innerHTML=ev.length>1?`<b>📈 Evolução</b><p class="mu">Seguidores e alcance em cada análise.</p>
      <div class="mu" style="margin-top:8px">Seguidores</div>${barras(ev,x=>x.data.perfil.followers_count||0,x=>dt(x.data.em)+": "+n(x.data.perfil.followers_count))}
      <div class="mu" style="margin-top:8px">Alcance (30 dias)</div>${barras(ev,x=>(x.data.conta&&x.data.conta.reach)||0,x=>dt(x.data.em)+": "+n(x.data.conta&&x.data.conta.reach))}`:'<b>📈 Evolução</b><p class="mu">Aparece a partir da segunda análise. Atualize uma vez por semana para acompanhar o crescimento.</p>';
    if(HIST[0]&&!$("#res").innerHTML)mostrar(HIST[0].data)}
  catch(e){$("#hist").innerHTML='<b>🕘 Análises anteriores</b><p class="mu">Sem acesso.</p>'}}
$("#hist").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;mostrar(HIST[+b.dataset.i].data);scrollTo({top:0,behavior:"smooth"})};

const AJUDA=`<div class="card"><b>⚙️ Falta ligar a ferramenta ao Instagram</b><p class="mu">Siga o passo a passo que o Claude passou: criar o app na Meta, gerar o token do @portofranco.online, rodar o <code>sql/03-instagram.sql</code>, criar a função <b>instagram</b> no Supabase e cadastrar o segredo <code>IG_TOKEN</code>.</p></div>`;
$("#go").onclick=async()=>{$("#er").textContent="";$("#go").disabled=true;$("#go").textContent="Buscando números do Instagram…";
  try{const r=await PFO.client().functions.invoke("instagram",{body:{}});
    if(r.error){const st=r.error.context&&r.error.context.status;if(st===404||/Failed to send/i.test(r.error.message||""))throw{ajuda:true};
      let m=r.error.message;try{const j=await r.error.context.json();m=j.erro||m}catch(_){}throw new Error(m)}
    if(!r.data||!r.data.perfil)throw new Error((r.data&&r.data.erro)||"Resposta vazia.");
    mostrar(r.data);await PFO.db.doc("instagram/"+r.data.em.slice(0,10)).set(r.data);historico()}
  catch(e){if(e&&e.ajuda)$("#res").innerHTML=AJUDA;else $("#er").textContent=(e&&e.message)||String(e)}
  finally{$("#go").disabled=false;$("#go").textContent="🔄 Atualizar análise"}};
(async()=>{const db=await window.claude.use("db");if(db)historico()})();
</script>
</body>
</html>
