<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Porto Franco Online · Sistema</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1f3a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="baixar.js"></script>
<script src="config.js"></script>
<script src="shim.js"></script>
<script src="excel.js"></script>
<style>
:root{--bg:#f2f5fa;--tx:#0b1f3a;--mu:#5b6b7f;--cy:#0b7285;--gr:#12a37a;--rd:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{background:linear-gradient(120deg,#0b1f3a,#0b7285 70%,#12a37a);color:#fff;padding:20px 18px 22px;border-radius:0 0 24px 24px;box-shadow:0 6px 18px rgba(11,31,58,.18)}
header .row{display:flex;align-items:center;gap:12px;max-width:860px;margin:auto}
header img{height:52px;background:#fff;border-radius:12px;padding:6px 8px}
header h1{font-size:19px;margin:0}header small{color:#cfe9f0}
main{max-width:860px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(11,31,58,.08)}
.lista{display:flex;flex-direction:column;gap:12px}a.mod i{margin-left:auto;font-style:normal;font-size:26px;color:#9aabbf}a.mod.mini{margin:12px 0}a.mod.mini .ic{background:#e7edf6;width:40px;height:40px;font-size:22px}
a.mod{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:16px;text-decoration:none;color:var(--tx);box-shadow:0 1px 3px rgba(11,31,58,.08);transition:transform .12s}
a.mod:active{transform:scale(.98)}a.mod .ic{font-size:30px;width:56px;height:56px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#0b7285,#12a37a);flex:none}
a.mod b{display:block}a.mod span{font-size:12.5px;color:var(--mu)}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px;font-weight:700}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #c9d6e6;font:inherit;background:#fff;color:var(--tx)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:12px 14px;background:var(--cy);color:#fff;font-weight:800;width:100%;margin-top:14px}
.btn.g{background:#e7edf6;color:var(--tx)}.btn.r{background:#fde0e0;color:var(--rd)}
.mu{color:var(--mu);font-size:13px}.err{color:var(--rd);font-weight:700;font-size:13px;min-height:18px;margin-top:8px}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px;background:#e7edf6;color:var(--mu)}
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e6ecf4;flex-wrap:wrap}.li:last-child{border:0}
.li .sp{flex:1;min-width:120px}.li button,.li select{width:auto;margin:0;padding:8px 10px;font-size:13px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#0b1f3a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;display:none;z-index:9}
.hide{display:none!important}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.kv{border-radius:18px;padding:16px;color:#fff;box-shadow:0 8px 20px rgba(11,31,58,.18)}.kv span{font-size:12px;font-weight:800;opacity:.9}.kv b{display:block;font-size:40px;line-height:1.1}.kv small{font-weight:700;opacity:.95}
.kv.ve{background:linear-gradient(135deg,#b3261e,#e2574c)}.kv.av{background:linear-gradient(135deg,#ef8f00,#ffb74d)}
.gr{margin-top:12px}.gt{font-size:13px;font-weight:800;margin-bottom:6px}.bt{display:flex;align-items:center;gap:8px;margin:4px 0}.bt i{height:16px;border-radius:8px;display:block;transition:width .6s}.bt span{font-size:12.5px;font-weight:800;white-space:nowrap}
.leg{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--mu)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.vh{display:flex;justify-content:space-between;align-items:center}.vh a{color:var(--cy);font-weight:800;text-decoration:none}
.vg{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}@media(min-width:640px){.vg{grid-template-columns:1fr 1fr}}
.vt{font-size:12px;font-weight:800;border-radius:8px;padding:6px 10px;margin-bottom:4px}.vt.ve{background:#fde0e0;color:#b3261e}.vt.av{background:#ffefd2;color:#9a5a00}
.vl{display:flex;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px solid #eef2f8}.vl span{font-weight:700;font-size:13.5px}.vl small{display:block;font-weight:500;color:var(--mu);font-size:12px}.vl b{white-space:nowrap;font-size:13.5px}
a.btn.lk{display:block;text-align:center;text-decoration:none}textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #c9d6e6;font:inherit}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
details.dv{border-radius:14px;overflow:hidden}details.dv[open]{grid-column:1/-1}
details.dv summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;color:#fff;border-radius:14px}
details.dv summary::-webkit-details-marker{display:none}
details.dv.ve summary{background:linear-gradient(135deg,#b3261e,#e2574c)}details.dv.av summary{background:linear-gradient(135deg,#ef8f00,#ffb74d)}
details.dv .ico{font-size:22px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
details.dv .tx{flex:1;font-size:12.5px;font-weight:700;line-height:1.2}details.dv .tx b{font-size:22px;margin-right:4px}details.dv .tx small{display:block;font-size:12px;opacity:.95}
details.dv .sw{transition:transform .2s;font-size:18px}details.dv[open] .sw{transform:rotate(180deg)}
details.dv .dl{background:#fff;border:1px solid #eef2f8;border-top:0;padding:4px 10px 8px;max-height:360px;overflow:auto;border-radius:0 0 14px 14px}
.vr{display:flex;align-items:center;gap:8px}.cob{border:0;border-radius:10px;background:#25d366;color:#fff;font-weight:800;font-size:12px;padding:7px 9px;cursor:pointer;white-space:nowrap}
.cbd{color:#12805c;font-style:normal;font-weight:700}
a.card.fn{display:block;text-decoration:none;color:var(--tx)}.fe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.fe div{background:#f2f5fa;border-radius:12px;padding:8px 4px;text-align:center}
.fe span{font-size:18px}.fe b{display:block;font-size:20px}.fe small{display:block;font-size:10.5px;color:var(--mu);line-height:1.1}
</style>
</head>
<body>
<header><div class="row"><img src="logo.png" alt="Porto Franco Online"><div><h1>Sistema Porto Franco Online</h1><small id="quem">Acesso restrito</small></div></div></header>
<main id="app"><div class="card mu">Carregando…</div></main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3200)}
function emailDoLogin(l){l=String(l||"").trim();if(l.includes("@"))return l.toLowerCase();
  const a="áàâãäéèêëíìîïóòôõöúùûüçñ",b="aaaaaeeeeiiiiooooouuuucn";
  return l.toLowerCase().split("").map(c=>{const i=a.indexOf(c);return i>=0?b[i]:c}).join("").replace(/[^a-z0-9]/g,"")+"@pfonline.local"}
function msgErro(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/Invalid login credentials/i.test(m))return"Login ou senha incorretos.";
  if(/Failed to fetch|NetworkError/i.test(m))return"Sem conexão com o banco. Verifique a internet.";
  if(/function .* does not exist|Could not find the function/i.test(m))return"O banco ainda não foi instalado. Rode o arquivo sql/instalacao.sql no Supabase.";
  return m}
const voltar=new URLSearchParams(location.search).get("voltar");
const sb=()=>PFO.client();

async function iniciar(){
  let s=null;try{s=await PFO.sessao()}catch(e){$("#app").innerHTML='<div class="card err">'+esc(msgErro(e))+'</div>';return}
  if(!s)return telaLogin();
  const p=await PFO.perfil();
  if(!p){$("#app").innerHTML='<div class="card"><b>Seu login não tem acesso a este sistema.</b><p class="mu">Peça ao administrador para liberar o seu acesso.</p><button class="btn g" onclick="PFO.sair()">Sair</button></div>';return}
  if(voltar&&voltar.startsWith(new URL(PFO.base).pathname)&&voltar!==new URL(PFO.base).pathname){location.replace(voltar);return}
  menu(p)}

async function telaLogin(){
  let temAdmin=true;
  try{const r=await sb().rpc("tem_admin");if(r.error)throw r.error;temAdmin=!!r.data}catch(e){$("#app").innerHTML='<div class="card"><b>Não consegui falar com o banco de dados.</b><p class="err">'+esc(msgErro(e))+'</p></div>';return}
  if(!temAdmin){
    $("#app").innerHTML=`<div class="card"><b>Primeiro acesso: criar o administrador</b><p class="mu">Este login vai controlar tudo, inclusive quem pode entrar no sistema. Guarde bem a senha.</p>
    <label>Login (ex.: Ricardo)</label><input id="lg" autocomplete="username"><label>Senha (mínimo 6 caracteres)</label><input id="sn" type="password" autocomplete="new-password"><label>Repita a senha</label><input id="sn2" type="password" autocomplete="new-password">
    <button class="btn" id="ok">Criar administrador e entrar</button><div class="err" id="er"></div></div>`;
    $("#ok").onclick=async()=>{const l=$("#lg").value.trim(),s1=$("#sn").value,s2=$("#sn2").value;
      if(!l)return $("#er").textContent="Digite o login.";if(s1.length<6)return $("#er").textContent="A senha precisa de pelo menos 6 caracteres.";if(s1!==s2)return $("#er").textContent="As senhas não são iguais.";
      $("#ok").disabled=true;try{const r=await sb().rpc("criar_primeiro_admin",{p_login:l,p_senha:s1});if(r.error)throw r.error;
        const a=await sb().auth.signInWithPassword({email:r.data||emailDoLogin(l),password:s1});if(a.error)throw a.error;iniciar()}catch(e){$("#er").textContent=msgErro(e);$("#ok").disabled=false}};
    return}
  $("#app").innerHTML=`<div class="card" style="max-width:420px;margin:24px auto"><b>Entrar</b><p class="mu">Use o login e a senha criados pelo administrador.</p>
  <form id="f"><label>Login</label><input id="lg" autocomplete="username" autocapitalize="none"><label>Senha</label><input id="sn" type="password" autocomplete="current-password">
  <button class="btn" id="ok">Entrar</button></form><div class="err" id="er"></div></div>`;
  $("#f").onsubmit=async ev=>{ev.preventDefault();$("#ok").disabled=true;$("#er").textContent="";
    try{const a=await sb().auth.signInWithPassword({email:emailDoLogin($("#lg").value),password:$("#sn").value});if(a.error)throw a.error;iniciar()}catch(e){$("#er").textContent=msgErro(e);$("#ok").disabled=false}}}

const NOMES={admin:"Administrador",leitura:"Sem acesso aos dados"};
const LINKS=[["Proposta Porto Franco Online","propostas/online/"],["Proposta Painel de LED","propostas/painel/"]];
const linkDe=p=>new URL(p,PFO.base).href;
function menu(p){
  $("#quem").textContent="Olá, "+p.login+(p.papel==="admin"?" · Administrador":"");
  if(p.papel!=="admin"){
    $("#app").innerHTML=`<div class="card"><b>Seu login não tem acesso às áreas do sistema.</b><p class="mu">Publicidade, Painel de LED e as propostas são liberados só para o administrador.</p></div>
    <div class="card"><b>🔑 Trocar minha senha</b><label>Nova senha</label><input id="ns" type="password" autocomplete="new-password"><button class="btn g" id="tsn">Salvar nova senha</button></div>
    <button class="btn r" onclick="PFO.sair()">🚪 Sair</button>`;trocaSenha();return}
  $("#app").innerHTML=`<div id="dash"><div class="card mu">Carregando vencimentos…</div></div>
  <div id="funilres"></div>
  <div class="lista">
   <a class="mod" href="publicidade/"><div class="ic">📣</div><div><b>Porto Franco Online Publicidade</b><span>Clientes de publicidade online, pagamentos e despesas</span></div><i>›</i></a>
   <a class="mod" href="painel/"><div class="ic">💡</div><div><b>Painel de LED</b><span>Clientes, pagamentos, despesas e relatórios do painel</span></div><i>›</i></a>
   <a class="mod" href="propostas/online/" target="_blank"><div class="ic">📝</div><div><b>Proposta Porto Franco Online</b><span>Planos de divulgação para enviar ao cliente</span></div><i>›</i></a>
   <a class="mod" href="propostas/painel/" target="_blank"><div class="ic">📄</div><div><b>Proposta Painel de LED</b><span>Proposta do painel para enviar ao cliente</span></div><i>›</i></a>
  </div>
  <div class="card"><b>⬇ Exportar Excel</b><p class="mu">Baixa a sua planilha original, no mesmo formato, com os pagamentos, clientes e despesas atualizados do sistema.</p>
   <div class="row2"><button class="btn g" onclick="PFOX.baixar('online',this)">⬇ Excel Publicidade</button><button class="btn g" onclick="PFOX.baixar('painel',this)">⬇ Excel Painel de LED</button></div></div>
  <div class="card" id="env"><b>📤 Enviar propostas</b><p class="mu">Links abertos: o cliente vê a proposta sem precisar de login.</p>
   ${LINKS.map((l,i)=>`<div class="li"><div class="sp"><b>${l[0]}</b><br><span class="mu">${esc(linkDe(l[1]))}</span></div><button class="btn g" data-cp="${i}">Copiar link</button></div>`).join("")}
   <div class="row2"><button class="btn g" id="cpall">📋 Copiar os dois links</button><a class="btn lk" id="wa" target="_blank" rel="noopener" style="background:#25d366">💬 Enviar no WhatsApp</a></div></div>
  <div class="card" id="us"><b>👥 Logins de acesso</b><p class="mu">Carregando…</p></div>
  <a class="mod mini" href="funil.html"><div class="ic">🎯</div><div><b>Funil de vendas</b><span>Interessados, propostas enviadas, negociação e fechamento</span></div><i>›</i></a>
  <a class="mod mini" href="tabelas.html"><div class="ic">📊</div><div><b>Tabelas (como Excel)</b><span>Editar à mão, baixar em Excel e subir de volta</span></div><i>›</i></a>
  <div class="card" id="cfg"><b>⚙️ Configurações</b>
   <label>Avisar "a vencer" com quantos dias de antecedência</label><input id="cdias" type="number" min="1" max="31">
   <label>Mensagem do WhatsApp (os links entram no final)</label><textarea id="cmsg" rows="3"></textarea>
   <label>Chave PIX (entra nas mensagens de cobrança)</label><input id="cpix" placeholder="CNPJ, celular, e-mail ou chave aleatória">
   <label>Cobrança — mensagem para quem está A VENCER</label><textarea id="cmav" rows="4"></textarea>
   <label>Cobrança — mensagem para quem está VENCIDO</label><textarea id="cmve" rows="4"></textarea>
   <p class="mu">Use: {nome} cliente · {responsavel} · {valor} · {vencimento} · {meses} meses em aberto · {pix}</p>
   <button class="btn g" id="csv">Salvar configurações</button>
   <hr style="border:0;border-top:1px solid #e6ecf4;margin:16px 0 4px">
   <b>💾 Cópia dos dados</b><p class="mu">Baixa um arquivo com todos os dados do sistema (clientes, pagamentos, despesas, propostas e cores). Use para guardar uma cópia ou para atualizar os artefatos no Claude.</p>
   <button class="btn" id="bkp">⬇ Baixar cópia dos dados</button></div>
  <div class="card"><b>🔑 Trocar minha senha</b><label>Nova senha</label><input id="ns" type="password" autocomplete="new-password"><button class="btn g" id="tsn">Salvar nova senha</button></div>
  <button class="btn r" onclick="PFO.sair()">🚪 Sair</button>`;
  const texto=()=>CFG.msg.trim()+"\n\n"+LINKS.map(l=>"• "+l[0]+": "+linkDe(l[1])).join("\n");
  const atualizaWa=()=>{$("#wa").href="https://api.whatsapp.com/send?text="+encodeURIComponent(texto())};
  const copiar=async(t,m)=>{try{await navigator.clipboard.writeText(t);toast(m)}catch(e){prompt("Copie o texto:",t)}};
  $("#env").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;
    if(b.dataset.cp!=null)copiar(linkDe(LINKS[+b.dataset.cp][1]),"Link copiado.");
    if(b.id==="cpall")copiar(texto(),"Os dois links foram copiados.")};
  trocaSenha();usuarios(p);
  carregarCfg().then(()=>{$("#cdias").value=CFG.dias;$("#cmsg").value=CFG.msg;$("#cpix").value=CFG.pix;$("#cmav").value=CFG.cobAv;$("#cmve").value=CFG.cobVe;atualizaWa();painelVenc();painelFunil()});
  $("#csv").onclick=async()=>{CFG.dias=Math.max(1,Math.min(31,parseInt($("#cdias").value)||5));CFG.msg=$("#cmsg").value||CFG_PADRAO.msg;CFG.pix=$("#cpix").value.trim();CFG.cobAv=$("#cmav").value||CFG_PADRAO.cobAv;CFG.cobVe=$("#cmve").value||CFG_PADRAO.cobVe;
    try{await PFO.db.doc("config/main").set(CFG);toast("Configurações salvas.");atualizaWa();painelVenc()}catch(e){toast(msgErro(e))}};
  $("#bkp").onclick=async()=>{try{const r=await sb().from("app_docs").select("id,data,updated_at").not("id","like","modelo/%");if(r.error)throw r.error;
    const pac={sistema:"Porto Franco Online",gerado_em:new Date().toISOString(),docs:Object.fromEntries(r.data.map(x=>[x.id,x.data]))};
    const d=new Date().toISOString().slice(0,10);await PFO.downloads.save({filename:"copia-dados-porto-franco-online-"+d+".json",data:new Blob([JSON.stringify(pac,null,1)],{type:"application/json"})});toast("Cópia baixada.")}catch(e){toast(msgErro(e))}}}

/* ---------- configurações ---------- */
const CFG_PADRAO={dias:5,msg:"Olá! Seguem as propostas do Porto Franco Online:",pix:"",
  cobAv:"Olá, {responsavel}! Tudo bem? 😊\nPassando para lembrar que a mensalidade da {nome} com o Porto Franco Online, no valor de {valor}, vence em {vencimento}.\nChave PIX: {pix}\nObrigado pela parceria!",
  cobVe:"Olá, {responsavel}! Tudo bem?\nConsta em aberto a mensalidade da {nome} com o Porto Franco Online ({meses}), total de {valor}.\nChave PIX: {pix}\nSe já pagou, por favor desconsidere e me envie o comprovante. Obrigado!"};
let CFG={...CFG_PADRAO};
async function carregarCfg(){try{const s=await PFO.db.doc("config/main").get();if(s.exists)CFG={...CFG_PADRAO,...s.data()}}catch(e){}}

/* ---------- vencimentos (mesma regra da aba Vencimentos dos módulos) ---------- */
const brl=v=>"R$ "+(Math.round(v*100)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const hojeD=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const MS=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function analisar(d){
  const y=hojeD().getFullYear(),t=hojeD(),out={venc:[],avenc:[]};
  const pay=(c,y)=>{const a=(c.p&&c.p[y])||[];return Array.from({length:12},(_,i)=>a[i]==null?"":a[i])};
  const ativo=c=>c.status==="ATIVO"||c.status==="NEGATIVO";
  const start=c=>{if(!c.ini)return null;const p=c.ini.split("-").map(Number);let s=new Date(p[0],p[1]-1,p[2]);if(c.cob==="USA PARA PAGAR")s=new Date(p[0],p[1],1);return s};
  const inWin=(c,y,m)=>{const s=start(c);return !s||s<=new Date(y,m+1,0)};
  const due=(c,y,m)=>new Date(y,m,Math.min(c.dia||1,new Date(y,m+1,0).getDate()));
  for(const [id,c] of Object.entries((d&&d.clientes)||{})){if(!ativo(c))continue;
    const ab=[];for(let m=0;m<12;m++)if(pay(c,y)[m]===""&&inWin(c,y,m)&&due(c,y,m)<t)ab.push(m);
    let prox=null;for(let m=0;m<12&&!prox;m++)if(pay(c,y)[m]===""&&inWin(c,y,m))prox=due(c,y,m);if(!prox)prox=due(c,y+1,0);
    const dd=Math.round((prox-t)/864e5);
    if(dd<0||c.status==="NEGATIVO")out.venc.push({id,c,nome:c.nome,meses:ab.map(m=>MS[m]),mm:ab,valor:(c.valor||0)*Math.max(ab.length,1),data:prox});
    else if(dd<=CFG.dias)out.avenc.push({id,c,nome:c.nome,dias:dd,data:prox,valor:c.valor||0})}
  out.venc.sort((a,b)=>b.valor-a.valor);out.avenc.sort((a,b)=>a.dias-b.dias);return out}
async function painelVenc(){
  const box=$("#dash");if(!box)return;
  try{
    const mods=[["Porto Franco Online Publicidade","📣","online/main","publicidade/"],["Painel de LED","💡","painel/main","painel/"]];
    const res=[];for(const m of mods){const s=await PFO.db.doc(m[2]).get();res.push({m,a:analisar(s.exists?s.data():{})})}
    try{const l=await PFO.db.doc("cobrancas/main").get();COBLOG=l.exists?l.data():{}}catch(e){COBLOG={}}
    RES=res;
    const tot=k=>res.reduce((s,r)=>s+r.a[k].reduce((x,y)=>x+y.valor,0),0);
    const max=Math.max(1,...res.flatMap(r=>[r.a.venc.reduce((x,y)=>x+y.valor,0),r.a.avenc.reduce((x,y)=>x+y.valor,0)]));
    const barra=(v,cor)=>`<div class="bt"><i style="width:${Math.max(2,v/max*100)}%;background:${cor}"></i><span>${brl(v)}</span></div>`;
    box.innerHTML=`<div class="resumo"><div class="kv ve"><span>🔴 Vencidos</span><b>${res.reduce((s,r)=>s+r.a.venc.length,0)}</b><small>${brl(tot("venc"))} em atraso</small></div>
      <div class="kv av"><span>🟠 A vencer (${CFG.dias} dias)</span><b>${res.reduce((s,r)=>s+r.a.avenc.length,0)}</b><small>${brl(tot("avenc"))} a receber</small></div></div>
     <div class="card"><b>📊 Vencidos x a vencer</b>${res.map(r=>`<div class="gr"><div class="gt">${r.m[1]} ${r.m[0]}</div>
       ${barra(r.a.venc.reduce((x,y)=>x+y.valor,0),"linear-gradient(90deg,#e2574c,#b3261e)")}${barra(r.a.avenc.reduce((x,y)=>x+y.valor,0),"linear-gradient(90deg,#ffb74d,#ef8f00)")}</div>`).join("")}
       <div class="leg"><span><i style="background:#c62828"></i>Vencidos</span><span><i style="background:#ef8f00"></i>A vencer</span></div></div>
     ${res.map(r=>{const tv=r.a.venc.reduce((x,y)=>x+y.valor,0),ta=r.a.avenc.reduce((x,y)=>x+y.valor,0);return `<div class="card vc"><div class="vh"><b>${r.m[1]} ${r.m[0]}</b><a href="${r.m[3]}">abrir ›</a></div>
       <div class="ab">
        <details class="dv ve"><summary><span class="ico">🔴</span><span class="tx"><b>${r.a.venc.length}</b> vencidos<small>${brl(tv)}</small></span><span class="sw">▾</span></summary>
         <div class="dl">${r.a.venc.length?r.a.venc.map(x=>linhaCob(r,x,"ve",x.meses.length?x.meses.join(", "):"negativado")).join(""):'<p class="mu">Nenhum vencido 🎉</p>'}</div></details>
        <details class="dv av"><summary><span class="ico">🟠</span><span class="tx"><b>${r.a.avenc.length}</b> a vencer<small>${brl(ta)}</small></span><span class="sw">▾</span></summary>
         <div class="dl">${r.a.avenc.length?r.a.avenc.map(x=>linhaCob(r,x,"av",(x.dias===0?"vence hoje":"em "+x.dias+(x.dias===1?" dia":" dias"))+" · "+x.data.toLocaleDateString("pt-BR"))).join(""):'<p class="mu">Nada vencendo nos próximos dias.</p>'}</div></details>
       </div></div>`}).join("")}`}
  catch(e){box.innerHTML='<div class="card err">Não consegui carregar os vencimentos: '+esc(msgErro(e))+'</div>'}}

/* ---------- cobrança pelo WhatsApp ---------- */
let COBLOG={},RES=[];
const chaveCob=(r,x,tipo)=>r.m[2].split("/")[0]+":"+x.id+":"+tipo+":"+x.data.toISOString().slice(0,7);
function linhaCob(r,x,tipo,info){const k=chaveCob(r,x,tipo),qd=COBLOG[k];
  return `<div class="vl"><span>${esc(x.nome)}<small>${esc(info)}${qd?` · <em class="cbd">✔ cobrado ${new Date(qd).toLocaleDateString("pt-BR")}</em>`:""}</small></span>
   <span class="vr"><b>${brl(x.valor)}</b><button class="cob" data-mod="${r.m[2]}" data-id="${esc(x.id)}" data-t="${tipo}" title="Cobrar pelo WhatsApp">💬 Cobrar</button></span></div>`}
function telefone(t){let d=String(t||"").replace(/\D/g,"");if(!d)return"";if(d.length<=11)d="55"+d.replace(/^0+/,"");return d.length>=12?d:""}
function mensagemCob(x,tipo){const c=x.c||{};const tpl=tipo==="ve"?CFG.cobVe:CFG.cobAv;
  return tpl.replace(/\{nome\}/g,c.nome||"").replace(/\{responsavel\}/g,(c.resp||"").trim()||"tudo bem").replace(/\{valor\}/g,brl(x.valor))
   .replace(/\{vencimento\}/g,x.data.toLocaleDateString("pt-BR")).replace(/\{meses\}/g,(x.meses&&x.meses.length?x.meses.join(", "):"em aberto")).replace(/\{pix\}/g,CFG.pix||"(peça a chave PIX)")
   .replace(/Olá, tudo bem! Tudo bem\?/,"Olá! Tudo bem?")}
document.addEventListener("click",async ev=>{const b=ev.target.closest("button.cob");if(!b)return;ev.preventDefault();
  const r=RES.find(z=>z.m[2]===b.dataset.mod);if(!r)return;const lista=b.dataset.t==="ve"?r.a.venc:r.a.avenc,x=lista.find(z=>String(z.id)===b.dataset.id);if(!x)return;
  let fone=telefone(x.c.tel),novo=false;
  if(!fone){const t=prompt("Sem telefone cadastrado para "+x.nome+".\nDigite o WhatsApp com DDD (ex.: 99 98111-2222):");if(!t)return;fone=telefone(t);if(!fone)return toast("Número inválido.");novo=t}
  window.open("https://api.whatsapp.com/send?phone="+fone+"&text="+encodeURIComponent(mensagemCob(x,b.dataset.t)),"_blank");
  const k=chaveCob(r,x,b.dataset.t);COBLOG[k]=new Date().toISOString();
  try{await PFO.db.doc("cobrancas/main").set(COBLOG);
    if(novo){const s=await PFO.db.doc(b.dataset.mod).get(),d=s.data(),cl=d.clientes||{};if(cl[x.id]){cl[x.id].tel=novo;await PFO.db.doc(b.dataset.mod).update({clientes:cl});toast("Telefone salvo no cadastro.")}}}catch(e){toast(msgErro(e))}
  painelVenc()});

/* ---------- funil (resumo na tela inicial) ---------- */
const ETAPAS=[["contato","Contato","📞"],["proposta","Proposta enviada","📤"],["negociando","Negociando","🤝"],["fechado","Fechado","✅"],["perdido","Perdido","✖️"]];
async function painelFunil(){const box=$("#funilres");if(!box)return;
  try{const s=await PFO.db.doc("funil/main").get(),it=(s.exists&&s.data().itens)||[];
    const n=e=>it.filter(x=>x.etapa===e).length,neg=it.filter(x=>x.etapa==="proposta"||x.etapa==="negociando").reduce((a,x)=>a+(+x.valor||0),0);
    const hoje=new Date().toISOString().slice(0,10),atras=it.filter(x=>x.data&&x.data<=hoje&&!["fechado","perdido"].includes(x.etapa)).length;
    box.innerHTML=`<a class="card fn" href="funil.html"><div class="vh"><b>🎯 Funil de vendas</b><span class="mu">abrir ›</span></div>
     <div class="fe">${ETAPAS.map(e=>`<div><span>${e[2]}</span><b>${n(e[0])}</b><small>${e[1]}</small></div>`).join("")}</div>
     <div class="mu">💰 Em negociação: <b>${brl(neg)}</b>${atras?` · ⏰ <b style="color:#b3261e">${atras} retorno${atras>1?"s":""} para hoje</b>`:""}</div></a>`}catch(e){box.innerHTML=""}}
function trocaSenha(){$("#tsn").onclick=async()=>{const v=$("#ns").value;if(v.length<6)return toast("Use pelo menos 6 caracteres.");const r=await sb().auth.updateUser({password:v});toast(r.error?msgErro(r.error):"Senha alterada.");$("#ns").value=""}}

async function usuarios(eu){
  const r=await sb().from("perfis").select("login,papel,criado_em").order("login");
  const box=$("#us");if(r.error){box.innerHTML='<b>👥 Logins de acesso</b><p class="err">'+esc(msgErro(r.error))+'</p>';return}
  const opt=v=>Object.keys(NOMES).map(k=>`<option value="${k}" ${k===v?"selected":""}>${NOMES[k]}</option>`).join("");
  box.innerHTML=`<b>👥 Logins de acesso</b><p class="mu">Só o <b>Administrador</b> vê e altera Publicidade, Painel de LED, Tabelas e envia as propostas.</p>
  ${r.data.map(u=>`<div class="li"><div class="sp"><b>${esc(u.login)}</b>${u.login===eu.login?' <span class="tag">você</span>':''}</div>
   <select data-pa="${esc(u.login)}" ${u.login===eu.login?"disabled":""}>${opt(u.papel)}</select>
   <button class="btn g" data-rs="${esc(u.login)}">Nova senha</button>${u.login===eu.login?"":`<button class="btn r" data-rm="${esc(u.login)}">Remover</button>`}</div>`).join("")}
  <div style="margin-top:10px"><b>Novo login</b><div class="row2"><div><label>Login</label><input id="nl" placeholder="ex.: Kaliel"></div><div><label>Senha</label><input id="np" type="text" placeholder="mín. 6"></div></div>
  <label>Acesso</label><select id="npa">${opt("admin")}</select><button class="btn" id="cria">Criar login</button></div>`;
  box.onclick=async ev=>{const b=ev.target.closest("button");if(!b)return;
    try{
      if(b.id==="cria"){const l=$("#nl").value.trim(),s=$("#np").value;if(!l||s.length<6)return toast("Digite o login e uma senha de 6+ caracteres.");
        const x=await sb().rpc("criar_login",{p_login:l,p_senha:s,p_papel:$("#npa").value});if(x.error)throw x.error;toast("Login criado: "+l);return usuarios(eu)}
      if(b.dataset.rs){const s=prompt("Nova senha para "+b.dataset.rs+" (mínimo 6 caracteres):");if(!s)return;
        const x=await sb().rpc("redefinir_senha",{p_login:b.dataset.rs,p_senha:s});if(x.error)throw x.error;toast("Senha redefinida.")}
      if(b.dataset.rm){if(!confirm("Remover o login "+b.dataset.rm+"? A pessoa perde o acesso na hora."))return;
        const x=await sb().rpc("remover_login",{p_login:b.dataset.rm});if(x.error)throw x.error;toast("Login removido.");usuarios(eu)}
    }catch(e){toast(msgErro(e))}};
  box.onchange=async ev=>{const s=ev.target.closest("select[data-pa]");if(!s)return;
    const x=await sb().rpc("mudar_papel",{p_login:s.dataset.pa,p_papel:s.value});toast(x.error?msgErro(x.error):"Acesso alterado.");if(x.error)usuarios(eu)}}
iniciar();
</script>
