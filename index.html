<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Porto Franco Online · Sistema</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1f3a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shim.js"></script>
<style>
:root{--bg:#f2f5fa;--tx:#0b1f3a;--mu:#5b6b7f;--cy:#0b7285;--gr:#12a37a;--rd:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{background:linear-gradient(120deg,#0b1f3a,#0b7285 70%,#12a37a);color:#fff;padding:20px 18px 22px;border-radius:0 0 24px 24px;box-shadow:0 6px 18px rgba(11,31,58,.18)}
header .row{display:flex;align-items:center;gap:12px;max-width:860px;margin:auto}
header img{height:52px;background:#fff;border-radius:12px;padding:6px 8px}
header h1{font-size:19px;margin:0}header small{color:#cfe9f0}
main{max-width:860px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(11,31,58,.08)}
.lista{display:flex;flex-direction:column;gap:12px}a.mod i{margin-left:auto;font-style:normal;font-size:26px;color:#9aabbf}a.mod.mini{margin:12px 0}a.mod.mini .ic{background:#e7edf6;width:40px;height:40px;font-size:22px}
a.mod{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:16px;text-decoration:none;color:var(--tx);box-shadow:0 1px 3px rgba(11,31,58,.08);transition:transform .12s}
a.mod:active{transform:scale(.98)}a.mod .ic{font-size:30px;width:56px;height:56px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#0b7285,#12a37a);flex:none}
a.mod b{display:block}a.mod span{font-size:12.5px;color:var(--mu)}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px;font-weight:700}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #c9d6e6;font:inherit;background:#fff;color:var(--tx)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:12px 14px;background:var(--cy);color:#fff;font-weight:800;width:100%;margin-top:14px}
.btn.g{background:#e7edf6;color:var(--tx)}.btn.r{background:#fde0e0;color:var(--rd)}
.mu{color:var(--mu);font-size:13px}.err{color:var(--rd);font-weight:700;font-size:13px;min-height:18px;margin-top:8px}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px;background:#e7edf6;color:var(--mu)}
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e6ecf4;flex-wrap:wrap}.li:last-child{border:0}
.li .sp{flex:1;min-width:120px}.li button,.li select{width:auto;margin:0;padding:8px 10px;font-size:13px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#0b1f3a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;display:none;z-index:9}
.hide{display:none!important}
</style>
</head>
<body>
<header><div class="row"><img src="logo.png" alt="Porto Franco Online"><div><h1>Sistema Porto Franco Online</h1><small id="quem">Acesso restrito</small></div></div></header>
<main id="app"><div class="card mu">Carregando…</div></main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3200)}
function emailDoLogin(l){l=String(l||"").trim();if(l.includes("@"))return l.toLowerCase();
  const a="áàâãäéèêëíìîïóòôõöúùûüçñ",b="aaaaaeeeeiiiiooooouuuucn";
  return l.toLowerCase().split("").map(c=>{const i=a.indexOf(c);return i>=0?b[i]:c}).join("").replace(/[^a-z0-9]/g,"")+"@pfonline.local"}
function msgErro(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/Invalid login credentials/i.test(m))return"Login ou senha incorretos.";
  if(/Failed to fetch|NetworkError/i.test(m))return"Sem conexão com o banco. Verifique a internet.";
  if(/function .* does not exist|Could not find the function/i.test(m))return"O banco ainda não foi instalado. Rode o arquivo sql/instalacao.sql no Supabase.";
  return m}
const voltar=new URLSearchParams(location.search).get("voltar");
const sb=()=>PFO.client();

async function iniciar(){
  let s=null;try{s=await PFO.sessao()}catch(e){$("#app").innerHTML='<div class="card err">'+esc(msgErro(e))+'</div>';return}
  if(!s)return telaLogin();
  const p=await PFO.perfil();
  if(!p){$("#app").innerHTML='<div class="card"><b>Seu login não tem acesso a este sistema.</b><p class="mu">Peça ao administrador para liberar o seu acesso.</p><button class="btn g" onclick="PFO.sair()">Sair</button></div>';return}
  if(voltar&&voltar.startsWith(new URL(PFO.base).pathname)&&voltar!==new URL(PFO.base).pathname){location.replace(voltar);return}
  menu(p)}

async function telaLogin(){
  let temAdmin=true;
  try{const r=await sb().rpc("tem_admin");if(r.error)throw r.error;temAdmin=!!r.data}catch(e){$("#app").innerHTML='<div class="card"><b>Não consegui falar com o banco de dados.</b><p class="err">'+esc(msgErro(e))+'</p></div>';return}
  if(!temAdmin){
    $("#app").innerHTML=`<div class="card"><b>Primeiro acesso: criar o administrador</b><p class="mu">Este login vai controlar tudo, inclusive quem pode entrar no sistema. Guarde bem a senha.</p>
    <label>Login (ex.: Ricardo)</label><input id="lg" autocomplete="username"><label>Senha (mínimo 6 caracteres)</label><input id="sn" type="password" autocomplete="new-password"><label>Repita a senha</label><input id="sn2" type="password" autocomplete="new-password">
    <button class="btn" id="ok">Criar administrador e entrar</button><div class="err" id="er"></div></div>`;
    $("#ok").onclick=async()=>{const l=$("#lg").value.trim(),s1=$("#sn").value,s2=$("#sn2").value;
      if(!l)return $("#er").textContent="Digite o login.";if(s1.length<6)return $("#er").textContent="A senha precisa de pelo menos 6 caracteres.";if(s1!==s2)return $("#er").textContent="As senhas não são iguais.";
      $("#ok").disabled=true;try{const r=await sb().rpc("criar_primeiro_admin",{p_login:l,p_senha:s1});if(r.error)throw r.error;
        const a=await sb().auth.signInWithPassword({email:r.data||emailDoLogin(l),password:s1});if(a.error)throw a.error;iniciar()}catch(e){$("#er").textContent=msgErro(e);$("#ok").disabled=false}};
    return}
  $("#app").innerHTML=`<div class="card" style="max-width:420px;margin:24px auto"><b>Entrar</b><p class="mu">Use o login e a senha criados pelo administrador.</p>
  <form id="f"><label>Login</label><input id="lg" autocomplete="username" autocapitalize="none"><label>Senha</label><input id="sn" type="password" autocomplete="current-password">
  <button class="btn" id="ok">Entrar</button></form><div class="err" id="er"></div></div>`;
  $("#f").onsubmit=async ev=>{ev.preventDefault();$("#ok").disabled=true;$("#er").textContent="";
    try{const a=await sb().auth.signInWithPassword({email:emailDoLogin($("#lg").value),password:$("#sn").value});if(a.error)throw a.error;iniciar()}catch(e){$("#er").textContent=msgErro(e);$("#ok").disabled=false}}}

const NOMES={admin:"Administrador",leitura:"Sem acesso aos dados"};
const LINKS=[["Proposta Porto Franco Online","propostas/online/"],["Proposta Painel de LED","propostas/painel/"]];
const linkDe=p=>new URL(p,PFO.base).href;
function menu(p){
  $("#quem").textContent="Olá, "+p.login+(p.papel==="admin"?" · Administrador":"");
  if(p.papel!=="admin"){
    $("#app").innerHTML=`<div class="card"><b>Seu login não tem acesso às áreas do sistema.</b><p class="mu">Publicidade, Painel de LED e as propostas são liberados só para o administrador.</p></div>
    <div class="card"><b>🔑 Trocar minha senha</b><label>Nova senha</label><input id="ns" type="password" autocomplete="new-password"><button class="btn g" id="tsn">Salvar nova senha</button></div>
    <button class="btn r" onclick="PFO.sair()">🚪 Sair</button>`;trocaSenha();return}
  $("#app").innerHTML=`<div class="lista">
   <a class="mod" href="publicidade/"><div class="ic">📣</div><div><b>Porto Franco Online Publicidade</b><span>Clientes de publicidade online, pagamentos e despesas</span></div><i>›</i></a>
   <a class="mod" href="painel/"><div class="ic">💡</div><div><b>Painel de LED</b><span>Clientes, pagamentos, despesas e relatórios do painel</span></div><i>›</i></a>
   <a class="mod" href="propostas/online/" target="_blank"><div class="ic">📝</div><div><b>Proposta Porto Franco Online</b><span>Planos de divulgação para enviar ao cliente</span></div><i>›</i></a>
   <a class="mod" href="propostas/painel/" target="_blank"><div class="ic">📄</div><div><b>Proposta Painel de LED</b><span>Proposta do painel para enviar ao cliente</span></div><i>›</i></a>
  </div>
  <div class="card" id="env"><b>📤 Enviar propostas</b><p class="mu">Links abertos: o cliente vê a proposta sem precisar de login.</p>
   ${LINKS.map((l,i)=>`<div class="li"><div class="sp"><b>${l[0]}</b><br><span class="mu">${esc(linkDe(l[1]))}</span></div><button class="btn g" data-cp="${i}">Copiar link</button></div>`).join("")}
   <div class="row2"><button class="btn g" id="cpall">📋 Copiar os dois links</button><button class="btn" id="wa" style="background:#25d366">💬 Enviar no WhatsApp</button></div></div>
  <div class="card" id="us"><b>👥 Logins de acesso</b><p class="mu">Carregando…</p></div>
  <a class="mod mini" href="tabelas.html"><div class="ic">📊</div><div><b>Tabelas (como Excel)</b><span>Editar à mão, baixar em Excel e subir de volta</span></div><i>›</i></a>
  <div class="card"><b>🔑 Trocar minha senha</b><label>Nova senha</label><input id="ns" type="password" autocomplete="new-password"><button class="btn g" id="tsn">Salvar nova senha</button></div>
  <button class="btn r" onclick="PFO.sair()">🚪 Sair</button>`;
  const texto=()=>"Olá! Seguem as propostas do Porto Franco Online:\n\n"+LINKS.map(l=>"• "+l[0]+": "+linkDe(l[1])).join("\n");
  const copiar=async(t,m)=>{try{await navigator.clipboard.writeText(t);toast(m)}catch(e){prompt("Copie o texto:",t)}};
  $("#env").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;
    if(b.dataset.cp!=null)copiar(linkDe(LINKS[+b.dataset.cp][1]),"Link copiado.");
    if(b.id==="cpall")copiar(texto(),"Os dois links foram copiados.");
    if(b.id==="wa")window.open("https://wa.me/?text="+encodeURIComponent(texto()),"_blank")};
  trocaSenha();usuarios(p)}
function trocaSenha(){$("#tsn").onclick=async()=>{const v=$("#ns").value;if(v.length<6)return toast("Use pelo menos 6 caracteres.");const r=await sb().auth.updateUser({password:v});toast(r.error?msgErro(r.error):"Senha alterada.");$("#ns").value=""}}

async function usuarios(eu){
  const r=await sb().from("perfis").select("login,papel,criado_em").order("login");
  const box=$("#us");if(r.error){box.innerHTML='<b>👥 Logins de acesso</b><p class="err">'+esc(msgErro(r.error))+'</p>';return}
  const opt=v=>Object.keys(NOMES).map(k=>`<option value="${k}" ${k===v?"selected":""}>${NOMES[k]}</option>`).join("");
  box.innerHTML=`<b>👥 Logins de acesso</b><p class="mu">Só o <b>Administrador</b> vê e altera Publicidade, Painel de LED, Tabelas e envia as propostas.</p>
  ${r.data.map(u=>`<div class="li"><div class="sp"><b>${esc(u.login)}</b>${u.login===eu.login?' <span class="tag">você</span>':''}</div>
   <select data-pa="${esc(u.login)}" ${u.login===eu.login?"disabled":""}>${opt(u.papel)}</select>
   <button class="btn g" data-rs="${esc(u.login)}">Nova senha</button>${u.login===eu.login?"":`<button class="btn r" data-rm="${esc(u.login)}">Remover</button>`}</div>`).join("")}
  <div style="margin-top:10px"><b>Novo login</b><div class="row2"><div><label>Login</label><input id="nl" placeholder="ex.: Kaliel"></div><div><label>Senha</label><input id="np" type="text" placeholder="mín. 6"></div></div>
  <label>Acesso</label><select id="npa">${opt("admin")}</select><button class="btn" id="cria">Criar login</button></div>`;
  box.onclick=async ev=>{const b=ev.target.closest("button");if(!b)return;
    try{
      if(b.id==="cria"){const l=$("#nl").value.trim(),s=$("#np").value;if(!l||s.length<6)return toast("Digite o login e uma senha de 6+ caracteres.");
        const x=await sb().rpc("criar_login",{p_login:l,p_senha:s,p_papel:$("#npa").value});if(x.error)throw x.error;toast("Login criado: "+l);return usuarios(eu)}
      if(b.dataset.rs){const s=prompt("Nova senha para "+b.dataset.rs+" (mínimo 6 caracteres):");if(!s)return;
        const x=await sb().rpc("redefinir_senha",{p_login:b.dataset.rs,p_senha:s});if(x.error)throw x.error;toast("Senha redefinida.")}
      if(b.dataset.rm){if(!confirm("Remover o login "+b.dataset.rm+"? A pessoa perde o acesso na hora."))return;
        const x=await sb().rpc("remover_login",{p_login:b.dataset.rm});if(x.error)throw x.error;toast("Login removido.");usuarios(eu)}
    }catch(e){toast(msgErro(e))}};
  box.onchange=async ev=>{const s=ev.target.closest("select[data-pa]");if(!s)return;
    const x=await sb().rpc("mudar_papel",{p_login:s.dataset.pa,p_papel:s.value});toast(x.error?msgErro(x.error):"Acesso alterado.");if(x.error)usuarios(eu)}}
iniciar();
</script>
</body>
</html>
