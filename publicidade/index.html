<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porto Franco Online Publicidade</title>
<style>
:root{--bg:#f2f5fa;--card:#fff;--card2:#e7edf6;--cy:#0b7285;--gr:#12805c;--tx:#0b1f3a;--mu:#5b6b7f;--rd:#c62828;--or:#b26a00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:30px}
header{padding:18px 16px 14px;background:linear-gradient(120deg,#0b1f3a,#0b7285 70%,#12a37a);color:#fff}h1{font-size:20px;margin:0}header small{color:#cfe9f0}
body.ro #ent,body.ro #novo,body.ro #nd,body.ro #fsv,body.ro .own{display:none}.rob{display:none;background:#ffefd2;color:#7a4a00;font-weight:800;font-size:12px;padding:6px 12px;text-align:center}body.ro .rob{display:block}.lg{height:54px;background:#fff;border-radius:12px;padding:6px 8px}.dl{display:flex;gap:8px;margin-top:12px}.dl button{flex:1;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:9px;font-weight:800}
nav{position:sticky;top:0;z-index:3;background:#fff;display:flex;overflow-x:auto;border-bottom:1px solid #dbe3ee;box-shadow:0 2px 6px rgba(11,31,58,.06)}
nav button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font-size:13px;font-weight:800;padding:12px 14px;white-space:nowrap}nav button span{margin-right:5px}nav button.on{color:var(--cy);border-bottom-color:var(--cy)}
main{padding:6px 12px;max-width:820px;margin:auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(11,31,58,.08);border-left:4px solid transparent}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mu{color:var(--mu);font-size:12.5px}.b{font-weight:700}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp .card{margin:0;border-left-color:var(--cy)}.kp b{font-size:19px;display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.chip{flex:0 0 auto;border:1px solid #cfd9e6;border-radius:8px;padding:7px 11px;background:#fff;color:var(--tx);font-weight:700;font-size:13px}
.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:10px;padding:12px 14px;background:var(--cy);color:#fff;font-weight:800;width:100%}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:#fde0e0;color:var(--rd)}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:4px 8px;white-space:nowrap}.t-ok{background:#dcf5ea;color:var(--gr)}.t-so{background:#ffefd2;color:var(--or)}.t-ve{background:#fde0e0;color:var(--rd)}.t-no{background:var(--card2);color:var(--mu)}
.av{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#0b7285,#12a37a);display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 auto}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.mc{border:1px solid #d6dfeb;border-radius:10px;padding:8px 2px;background:#fff;color:var(--tx);font-size:11px;text-align:center}
.mc b{display:block;font-size:12.5px;margin-top:2px}.mc.pg{background:#dcf5ea;border-color:#9bd9bf}.mc.ab{background:#fde0e0;border-color:#f1a9a9}.mc.an{background:#dbe8ff;border-color:#a9c3f5}.mc.pm{background:#ffefd2;border-color:#f0cf8e}.mc.off{opacity:.45}
#sheet{position:fixed;inset:0;background:rgba(11,31,58,.55);display:none;align-items:center;z-index:5;padding:10px}#sheet.on{display:flex}
#sh{background:#fff;border-radius:16px;padding:16px;width:100%;max-height:92vh;overflow:auto;max-width:640px;margin:auto}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:700}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #c9d6e6;background:#fff;color:var(--tx);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#0b1f3a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;display:none;z-index:9}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e6ecf4}.li:last-child{border:0}.ic{font-size:22px;width:30px;text-align:center}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;background:none;border:0;padding:0;font-size:10px;font-weight:800;color:var(--mu)}
.bar div{display:flex;align-items:flex-end;gap:2px;width:100%;flex:1}.bar i{flex:1;border-radius:3px 3px 0 0;min-height:1px}.bar.on{color:var(--cy)}.bar.on span{text-decoration:underline}

.kp .card{color:#fff;border:0;box-shadow:0 6px 14px rgba(11,31,58,.16)}.kp .card .mu{color:rgba(255,255,255,.85);font-weight:700;letter-spacing:.3px}.kp .card b{color:#fff!important;font-size:21px}
.kp .card:nth-child(1){background:linear-gradient(135deg,#0f8a63,#2bbf8f)}.kp .card:nth-child(2){background:linear-gradient(135deg,#0b1f3a,#1c4a8a)}.kp .card:nth-child(3){background:linear-gradient(135deg,#b3261e,#e2574c)}.kp .card:nth-child(4){background:linear-gradient(135deg,#0b7285,#22b8cf)}
.card{border-radius:16px}.card[data-c]{transition:transform .12s}.card[data-c]:active{transform:scale(.985)}.av{box-shadow:0 2px 6px rgba(11,31,58,.18)}
header{border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(11,31,58,.18)}nav{margin-top:8px}.chip{border-radius:999px}.btn{box-shadow:0 3px 8px rgba(11,114,133,.25)}.btn.g,.btn.r{box-shadow:none}

header{position:relative;overflow:hidden}header::after{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.16),transparent 28%);animation:pfspin 16s linear infinite;pointer-events:none}header>*{position:relative;z-index:1}
@keyframes pfspin{to{transform:rotate(360deg)}}
.hk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}@media(min-width:640px){.hk{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hk div{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:9px 11px;animation:pfrise .6s both}.hk div:nth-child(2){animation-delay:.06s}.hk div:nth-child(3){animation-delay:.12s}.hk div:nth-child(4){animation-delay:.18s}
.hk span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#cfe9f0;text-transform:uppercase}.hk b{display:block;font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}.hk small{font-size:11px;color:#d9eef3}
@keyframes pfrise{from{transform:translateY(8px)}to{transform:none}}
.pfch{width:100%;overflow-x:auto}.pfch svg{display:block;width:100%;min-width:520px;height:auto}
.pfb{transform-origin:bottom;transform-box:fill-box;animation:pfgrow .9s cubic-bezier(.2,.8,.2,1) both}@keyframes pfgrow{from{transform:scaleY(0)}}
.pfl{stroke-dasharray:2400;animation:pfdraw 1.6s ease both .25s}@keyframes pfdraw{from{stroke-dashoffset:2400}}
.pfhit{cursor:pointer}
.pft{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:6px 0}.pft img,.pft .av{width:34px;height:34px;border-radius:50%;font-size:12px}
.pftn{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pftr{height:7px;background:#e7edf6;border-radius:99px;margin-top:4px;overflow:hidden}
.pftf{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--tg2),var(--tg3));transform-origin:left;animation:pfgx 1s cubic-bezier(.2,.8,.2,1) both}@keyframes pfgx{from{transform:scaleX(0)}}
.pfd{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.pfd svg{width:150px;height:150px;flex:none}.pfs{animation:pfds 1.2s ease both}@keyframes pfds{from{stroke-dasharray:0 999}}
.pfdl{display:grid;gap:6px;font-size:13.5px;flex:1;min-width:140px}.pfdl div{display:flex;align-items:center;gap:8px}.pfdot{width:10px;height:10px;border-radius:50%}
.pfmq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);margin-top:8px}
.pfmt{display:flex;gap:14px;width:max-content;animation:pfsl 40s linear infinite}.pfmq:hover .pfmt{animation-play-state:paused}@keyframes pfsl{to{transform:translateX(-50%)}}
.pfmt img{width:62px;height:62px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 3px rgba(11,114,133,.25)}
.pfpanel{background:linear-gradient(135deg,var(--tg1) 0%,var(--tg2) 65%,var(--tg3) 125%)!important;color:#fff;border:0!important;box-shadow:0 10px 26px rgba(11,31,58,.28)}.pfpanel .pfmu{color:rgba(226,240,255,.8);font-size:12.5px}
.pfleg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 6px}@media(min-width:640px){.pfleg{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pfleg div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:12px 1fr;column-gap:8px;align-items:center}
.pfleg i{width:12px;height:12px;border-radius:4px;grid-row:span 2}.pfleg span{font-size:11px;color:rgba(226,240,255,.85);font-weight:700}.pfleg b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pfdsc{border:0;background:linear-gradient(135deg,#0b7285,#12a37a);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:6px 10px;margin-top:4px;white-space:nowrap}

:root{--tg1:#0b1f3a;--tg2:#0b7285;--tg3:#12a37a;--tp1:#8fa8ff;--tp2:#5161d6;--tr1:#5ef0c0;--tr2:#0f9d6e;--td1:#ff9a8b;--td2:#d93025;--tl:#ffd166}
header{background:linear-gradient(120deg,var(--tg1),var(--tg2) 70%,var(--tg3))!important}.av{background:linear-gradient(135deg,var(--tg2),var(--tg3))!important}
nav button.on{color:var(--tg2)!important;border-bottom-color:var(--tg2)!important}.chip.on{background:var(--tg1)!important;border-color:var(--tg1)!important}
.kp .card:nth-child(2){background:linear-gradient(135deg,var(--tg1),var(--tg2))!important}.kp .card:nth-child(4){background:linear-gradient(135deg,var(--tg2),var(--tg3))!important}
.pfcor{position:absolute;top:14px;right:14px;z-index:2;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12.5px}
.pfdes{background:linear-gradient(135deg,var(--td2),var(--td1))!important;color:#fff;border:0!important;box-shadow:0 10px 24px rgba(160,30,30,.28)}.pfdes .mu{color:rgba(255,255,255,.9)}.pfdes .li{border-color:rgba(255,255,255,.25)}
.pfdesb{margin-top:12px;background:#fff!important;color:var(--td2)!important;font-size:15px;animation:pfpulse 2.2s ease-in-out infinite}@keyframes pfpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.tmg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.tmb{border:2px solid transparent;border-radius:12px;padding:0;overflow:hidden;background:#fff;text-align:left}.tmb.on{border-color:var(--tx)}.tmb i{display:block;height:34px}.tmb span{display:block;font-size:12px;font-weight:800;padding:6px 8px}
.tcg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:6px}.tcg label{margin:6px 0 2px}.tcg input[type=color]{height:42px;padding:3px;cursor:pointer}
.tprev{height:70px;border-radius:14px;margin-top:10px;background:linear-gradient(120deg,var(--tg1),var(--tg2) 70%,var(--tg3));display:flex;align-items:flex-end;gap:6px;padding:10px}.tprev i{width:16px;border-radius:4px 4px 0 0}
.pfan iframe{width:100%;height:70vh;border:0;border-radius:12px;margin-top:8px;background:#0b1f3a;display:block}.pfan.fs{position:fixed;inset:0;z-index:8;margin:0;border-radius:0;padding:10px;overflow:auto}.pfan.fs iframe{height:calc(100vh - 150px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const ASSIN="LUIS RICARDO MENEZES DA SILVA ARRUDA";const MES=["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
const CATS=[["⛽","COMBUSTÍVEL"],["🧰","MATERIAIS"],["🍽️","ALIMENTAÇÃO"],["🌐","INTERNET"],["🧾","IMPOSTOS"],["🔧","MANUTENÇÃO"],["📦","OUTROS"]];
const PLANOS=["","DIARIO","QUINZENAL","MENSAL","CAPA","3 MESES","EM ABERTO","PERMUTA"];
const R$=v=>"R$ "+(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const isN=v=>typeof v==="number"&&isFinite(v);
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const fd=d=>d?String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear():"—";
const S={f:{},tab:"ini",y:new Date().getFullYear(),m:new Date().getMonth(),d:null,db:null,all:false};
const cl=()=>Object.entries((S.d&&S.d.clientes)||{}).map(([id,c])=>({id,...c})).sort((a,b)=>(a.dia||99)-(b.dia||99)||a.nome.localeCompare(b.nome));
const pay=(c,y)=>{const a=(c.p&&c.p[y])||[];return Array.from({length:12},(_,i)=>a[i]===undefined||a[i]===null?"":a[i])};
const ativo=c=>c.status==="ATIVO"||c.status==="NEGATIVO";
function start(c){if(!c.ini)return null;const p=c.ini.split("-").map(Number);let d=new Date(p[0],p[1]-1,p[2]);if(c.cob==="USA PARA PAGAR")d=new Date(p[0],p[1],1);return d}
const inWin=(c,y,m)=>{const s=start(c);return !s||s<=new Date(y,m+1,0)};
const dueDate=(c,y,m)=>new Date(y,m,Math.min(c.dia||1,new Date(y,m+1,0).getDate()));
function prev(c,y,m){const v=pay(c,y)[m];if(isN(v)||v==="PAGO")return c.valor||0;if(v==="")return ativo(c)&&inWin(c,y,m)?(c.valor||0):0;return 0}
function rec(c,y,m){const v=pay(c,y)[m];return isN(v)?v:v==="PAGO"?(c.valor||0):0}
function abertos(c,y){if(!ativo(c))return[];const t=today(),o=[];for(let m=0;m<12;m++)if(pay(c,y)[m]===""&&inWin(c,y,m)&&dueDate(c,y,m)<t)o.push(m);return o}
function prox(c){if(!ativo(c))return null;const y=new Date().getFullYear();for(let m=0;m<12;m++)if(pay(c,y)[m]===""&&inWin(c,y,m))return dueDate(c,y,m);return dueDate(c,y+1,0)}
function sit(c){if(!ativo(c))return["⚪ SEM COBRANÇA","t-no"];const p=prox(c),dd=Math.round((p-today())/864e5);if(dd<0||c.status==="NEGATIVO")return["🔴 VENCIDO","t-ve"];if(dd<=5)return["🟠 VENCE EM "+(dd===0?"HOJE":dd+" DIAS"),"t-so"];return["🟢 EM DIA","t-ok"]}
const dbr=d=>d?d.split("-").reverse().join("/"):"—";const hoje=()=>{const d=today();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function proxAb(c){const y=new Date().getFullYear();for(let m=0;m<12;m++)if(pay(c,y)[m]===""&&inWin(c,y,m))return{y,m};return{y:y+1,m:0}}
const desp=(y,m)=>((S.d&&S.d.despesas)||[]).filter(x=>x.ano===y&&x.mes===m+1);
function mes(y,m){const c=cl();const P=c.reduce((s,x)=>s+prev(x,y,m),0),Rr=c.reduce((s,x)=>s+rec(x,y,m),0),D=desp(y,m).reduce((s,x)=>s+(x.valor||0),0);return{P,R:Rr,D,L:Rr-D,A:Math.max(0,P-Rr)}}
function saldo(y,m){let s=(S.d&&S.d.saldoInicial)||0;const ys=[...new Set([...cl().flatMap(c=>Object.keys(c.p||{})),...((S.d&&S.d.despesas)||[]).map(x=>String(x.ano))])].map(Number).sort();for(const yy of ys)for(let mm=0;mm<12;mm++){if(yy>y||(yy===y&&mm>m))return s;s+=mes(yy,mm).L}return s}

/*ANIMADO*/
const SM=v=>{const a=Math.abs(v),g=v<0?"-":"";const f=(n,d)=>n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});if(a>=1e6)return g+"R$ "+f(a/1e6,1)+" mi";if(a>=1e4)return g+"R$ "+f(a/1e3,1)+" mil";return g+"R$ "+f(a,0)};
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function cnt(el,to){const from=+(el.dataset.v||0);el.dataset.v=to;if(RM||from===to){el.textContent=SM(to);return}const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-p,3);el.textContent=SM(from+(to-from)*e);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function heroK(){temaSub();setTimeout(anLoad,0);const hk=$("#hk");if(!hk||!S.d)return;let R=0,D=0;for(let m=0;m<12;m++){const q=mes(S.y,m);R+=q.R;D+=q.D}
 const at=cl().filter(c=>c.status==="ATIVO"),cart=at.reduce((s,c)=>s+(c.valor||0),0);
 const K=[["Recebido em "+S.y,R,""],["Lucro em "+S.y,R-D,R?"margem "+Math.round((R-D)/R*100)+"%":""],["Carteira mensal",cart,at.length+" ativos"],["Ticket médio",at.length?cart/at.length:0,"por cliente"]];
 if(hk.children.length!==4)hk.innerHTML=K.map((k,i)=>`<div><span></span><b id="hk${i}">R$ 0</b><small></small></div>`).join("");
 K.forEach((k,i)=>{const d=hk.children[i];d.querySelector("span").textContent=k[0];d.querySelector("small").textContent=k[2];cnt(d.querySelector("b"),k[1])})}
function niceSt(r){const p=Math.pow(10,Math.floor(Math.log10(r||1))),m=r/p;return(m<=1?1:m<=2?2:m<=5?5:10)*p}
function grafAnim(ms){const W=860,H=310,L=62,Rr=12,T=22,B=32,lu=ms.map(x=>x.L);const mx=Math.max(1,...ms.map(x=>Math.max(x.R,x.D,x.P))),mn=Math.min(0,...lu);
 const st=niceSt((mx-mn)/4),top=Math.ceil(mx/st)*st,bot=Math.floor(mn/st)*st,y=v=>T+(top-v)/(top-bot)*(H-T-B),cw=(W-L-Rr)/12;let g="",b="",pts=[];
 for(let v=bot;v<=top+1e-6;v+=st)g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.12)"/><text x="${L-8}" y="${y(v)+4}" fill="rgba(226,240,255,.75)" font-size="11" text-anchor="end">${SM(v)}</text>`;
 ms.forEach((x,i)=>{const X=L+i*cw,bw=cw*.24,x0=X+cw*.1;if(i===S.m)b+=`<rect x="${X+2}" y="${T-6}" width="${cw-4}" height="${H-T-B+6}" rx="10" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.25)"/>`;
  b+=`<rect class="pfb" style="animation-delay:${i*40}ms" x="${x0}" y="${y(x.P)}" width="${bw}" height="${Math.max(0,y(0)-y(x.P))}" rx="4" fill="url(#pfgp)"/>`;
  b+=`<rect class="pfb" style="animation-delay:${i*40+60}ms" x="${x0+bw+3}" y="${y(x.R)}" width="${bw}" height="${Math.max(0,y(0)-y(x.R))}" rx="4" fill="url(#pfgr)"/>`;
  b+=`<rect class="pfb" style="animation-delay:${i*40+120}ms" x="${x0+2*bw+6}" y="${y(x.D)}" width="${bw}" height="${Math.max(0,y(0)-y(x.D))}" rx="4" fill="url(#pfgd)"/>`;
  b+=`<text x="${X+cw/2}" y="${H-10}" fill="${i===S.m?"#fff":"rgba(226,240,255,.7)"}" font-weight="${i===S.m?800:600}" font-size="12" text-anchor="middle">${MES[i].slice(0,3)}</text>`;
  b+=`<rect class="pfhit" data-m="${i}" x="${X}" y="${T}" width="${cw}" height="${H-T}" fill="transparent"><title>${MES[i]}: previsto ${R$(x.P)} · recebido ${R$(x.R)} · despesas ${R$(x.D)} · lucro ${R$(x.L)}</title></rect>`;pts.push([X+cw/2,y(x.L)])});
 const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("");const k=ms[S.m]||{P:0,R:0,D:0,L:0};
 const leg=[["Previsto","var(--tp1)","var(--tp2)",k.P],["Recebido","var(--tr1)","var(--tr2)",k.R],["Despesas","var(--td1)","var(--td2)",k.D],["Lucro","var(--tl)","var(--tl)",k.L]];
 return `<div class="card pfpanel"><div class="row" style="flex-wrap:wrap"><b>Previsto × recebido × despesas · ${S.y}</b><span class="sp"></span><span class="pfmu">toque no mês</span></div>
